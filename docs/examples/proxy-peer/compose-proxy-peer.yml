# Standalone proxy-peer gateway. Not created by sandcat.
#
#   cp .env.example .env   # fill literals
#   docker compose --env-file netbird.env --env-file .env -f compose-proxy-peer.yml up -d --build
#
# Required env: NB_SETUP_KEY, NB_MANAGEMENT_URL, NB_API_TOKEN
# Optional:     NB_PEER_NAME (default proxy-peer)
# extra_hosts maps host.docker.internal → 172.17.0.1 (docker0). Colima's
# host-gateway is 192.168.5.2; UDP STUN to that IP hairpins.

services:
  proxy-peer:
    build:
      context: .
      dockerfile: Dockerfile.proxy-peer
      additional_contexts:
        sandcat-scripts: ../../../cli/templates/devcontainer/sandcat/scripts
      args:
        NETBIRD_VERSION: ${NETBIRD_VERSION}
        NETBIRD_SHA256_AMD64: ${NETBIRD_SHA256_AMD64}
        NETBIRD_SHA256_ARM64: ${NETBIRD_SHA256_ARM64}
    hostname: ${NB_PEER_NAME:-proxy-peer}
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    cap_add:
      - NET_ADMIN
    environment:
      - NB_SETUP_KEY=${NB_SETUP_KEY}
      - NB_MANAGEMENT_URL=${NB_MANAGEMENT_URL}
      - NB_API_TOKEN=${NB_API_TOKEN}
      - NB_PEER_NAME=${NB_PEER_NAME:-proxy-peer}
      - PROXY_PEER_PORT=8080
    volumes:
      - netbird-proxy-peer-state:/var/lib/netbird
    restart: unless-stopped

volumes:
  netbird-proxy-peer-state:
