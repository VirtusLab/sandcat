# Combined NetBird server — localhost defaults. Fill secrets from
# netbird-server.env (see README.md). exposedAddress must be reachable from
# Docker containers (Docker host LAN IP), not localhost.
server:
  listenAddress: ":80"
  # customize and parametrize for local development
  exposedAddress: "http://192.168.5.2:33073"
  stunPorts:
    - 3478
  metricsPort: 9090
  healthcheckAddress: ":9000"
  logLevel: info
  logFile: console
  disableAnonymousMetrics: true
  authSecret: ""
  dataDir: /var/lib/netbird
  auth:
    issuer: http://localhost:33073/oauth2
    signKeyRefreshEnabled: true
    dashboardRedirectURIs:
      - http://localhost:8080/nb-auth
      - http://localhost:8080/nb-silent-auth
    cliRedirectURIs:
      - http://localhost:53000/
  store:
    engine: sqlite
    encryptionKey: ""
