# Docker Compose 2.x rejects redeclaring a service that comes from an
# `include`, so customizations are merged through include override files
# instead of being declared here.
include:
  - path: sandcat/compose-proxy.yml
  - path:
      # Constant (non-user-editable) parts of the agent service — image build,
      # security hardening (no-new-privileges), network wiring through
      # wg-client, dependency ordering.
      - sandcat/compose-agent.yml
      # User-customizable parts of the agent service (volumes, environment),
      # merged over the base above.
      - compose-agent.override.yml
    # Resolve relative paths in both files from this directory.
    project_directory: .
