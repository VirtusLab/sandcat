services:
  capability-runtime:
    build:
      context: .
      dockerfile: Dockerfile.capability-runtime
    volumes:
      # Separate from wg-runtime:/run/sandcat:ro on agent — nested mounts fail there.
      - capability-socket:/run/sandcat-capability
      # The revoke socket lives on its own volume, mounted only here and by
      # mitmproxy. It deliberately does not ride on mitmproxy-config (which the
      # agent also mounts): mitmproxy runs as uid 1000 and so does vscode in the
      # agent, so mode 0600 on the socket would not keep the agent out. Story 11
      # (revoke path inaccessible to the agent) outranks the PRD's "no new
      # volume" constraint where the two conflict.
      - l7-revoke-socket:/run/sandcat-l7-revoke
      - ./capability-catalog.json:/etc/sandcat/capability-catalog.json:ro
      - ~/.config/sandcat/settings.json:/config/settings.json:ro
    environment:
      - SANDCAT_SETTINGS_USER=/config/settings.json
      - CAPABILITY_CATALOG_JSON=/etc/sandcat/capability-catalog.json
      - CAPABILITY_AGENT_SOCKET=/run/sandcat-capability/agent.sock
      - CAPABILITY_ADMIN_SOCKET=/run/sandcat-capability/admin.sock
      - MITMPROXY_REVOKE_SOCKET=/run/sandcat-l7-revoke/l7-revoke.sock
    restart: unless-stopped

volumes:
  capability-socket:
  # Also declared by compose-proxy.yml, which is absent in capability-only
  # projects; compose merges the two identical declarations when both apply.
  # Mounting this into the agent (or any other container running agent code)
  # would reopen the uid-1000 collision that mode 0600 cannot close.
  l7-revoke-socket:
