services:
  proxy-peer:
    build:
      context: .
      dockerfile: Dockerfile.proxy-peer
      args:
        NETBIRD_VERSION: ${NETBIRD_VERSION}
        NETBIRD_SHA256_AMD64: ${NETBIRD_SHA256_AMD64}
        NETBIRD_SHA256_ARM64: ${NETBIRD_SHA256_ARM64}
    # hostname and NB_PEER_NAME are set by enable_proxy_peer() from the
    # project-scoped peer name so dns_label matches capability-catalog.json.
    cap_add:
      - NET_ADMIN
    environment:
      - NB_SETUP_KEY
      - NB_MANAGEMENT_URL
      - NB_API_TOKEN
      - PROXY_PEER_PORT=8080
    volumes:
      # Read-only user settings; used to read netbird_api_token for the
      # post-enrollment dns_label patch (PATCH /api/peers/{id}).
      - ~/.config/sandcat/settings.json:/config/settings.json:ro
    restart: unless-stopped
