services:
  proxy-peer:
    build:
      context: .
      dockerfile: Dockerfile.proxy-peer
      args:
        NETBIRD_VERSION: ${NETBIRD_VERSION}
        NETBIRD_SHA256_AMD64: ${NETBIRD_SHA256_AMD64}
        NETBIRD_SHA256_ARM64: ${NETBIRD_SHA256_ARM64}
    # Fixed hostname so `netbird up --hostname` and the dns_label API patch
    # produce a clean FQDN (peer-proxy.netbird.selfhosted) rather than the
    # auto-generated peer-proxy-<ip-octet>-<ip-octet>.netbird.selfhosted form.
    hostname: peer-proxy
    cap_add:
      - NET_ADMIN
    environment:
      - NB_SETUP_KEY
      - NB_MANAGEMENT_URL
      # Peer display name and DNS label; matches the dns_label in capability-catalog.json.
      - NB_PEER_NAME=peer-proxy
      - PROXY_PEER_PORT=8080
    volumes:
      # Read-only user settings; used to read netbird_api_token for the
      # post-enrollment dns_label patch (PATCH /api/peers/{id}).
      - ~/.config/sandcat/settings.json:/config/settings.json:ro
    restart: unless-stopped
